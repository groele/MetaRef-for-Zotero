name: release

on:
  push:
    tags:
      - v**
      - V**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    uses: zotero-plugin-dev/workflows/.github/workflows/release-plugin.yml@main

    with:
      release: |
        version="${GITHUB_REF_NAME#v}"
        version="${version#V}"
        notes_file="$(find docs/releases -maxdepth 1 -type f -iname "v${version}.md" -print -quit)"
        if [ -n "$notes_file" ]; then
          gh release create "$GITHUB_REF_NAME" dist/zotero-metaflow.xpi --title "Zotero MetaFlow ${version}" --notes-file "$notes_file"
        else
          gh release create "$GITHUB_REF_NAME" dist/zotero-metaflow.xpi --title "Zotero MetaFlow ${version}" --generate-notes
        fi
      comment-template: ""
