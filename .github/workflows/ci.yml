name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - run: pnpm build
      - name: Upload XPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: linter-for-zotero
          path: .scaffold/build/addon/

  test:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Setup Zotero
        uses: zotero-plugin-dev/setup-zotero@v1
      - name: Start a window manager
        run: |
          sudo apt-get update
          sudo apt-get install -y openbox wmctrl
          openbox --sm-disable >/tmp/metaflow-openbox.log 2>&1 &
          for attempt in {1..30}; do
            wmctrl -m && exit 0
            sleep 1
          done
          cat /tmp/metaflow-openbox.log
          exit 1
      - run: pnpm test
