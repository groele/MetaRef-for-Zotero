<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
  <html:link rel="localization" href="__addonRef__-rules.ftl" />
  <html:link rel="localization" href="__addonRef__-main-window.ftl" />
  <html:link rel="localization" href="schema.ftl" />
</linkset>
<vbox id="__addonRef__">
  <!-- 一般设置 -->
  <groupbox>
    <label><html:h2 data-l10n-id="section-general" /></label>
    <!-- 添加时自动执行格式化 -->
    <checkbox
      data-l10n-id="lint-on-item-added"
      preference="lint.onAdded"
      native="true"
    />
    <description
      data-l10n-id="lint-on-item-added-description"
      class="metaref-pref-description"
    />
    <description
      data-l10n-id="workflow-execution-overview"
      class="metaref-pref-description"
    />
    <checkbox
      data-l10n-id="workflow-remote-authors-check"
      preference="workflow.remoteAuthorsOnCheck"
      native="true"
    />
    <description
      data-l10n-id="workflow-remote-authors-description"
      class="metaref-pref-description"
    />

    <!-- 添加时自动执行格式化（群组条目） -->
    <checkbox
      data-l10n-id="lint-on-groupItem-added"
      preference="lint.onGroup"
      native="true"
    />
    <description
      data-l10n-id="lint-on-groupItem-added-description"
      class="metaref-pref-description"
    />
    <!-- 格式化时 -->
    <checkbox
      data-l10n-id="metadata-auto-update-on-added"
      preference="metadata.autoUpdateOnAdded"
      native="true"
    /><description
      data-l10n-id="metadata-auto-update-description"
      class="metaref-pref-description"
    />
    <checkbox
      data-l10n-id="easyscholar-auto-update-on-added"
      preference="easyscholar.autoUpdateOnAdded"
      native="true"
    />
    <description
      data-l10n-id="easyscholar-auto-update-on-added-description"
      class="metaref-pref-description"
    />
  </groupbox>

  <!-- 右键菜单与核心功能 -->
  <groupbox id="metaref-core-workflows">
    <label><html:h2 data-l10n-id="core-workflows-heading" /></label>
    <description
      data-l10n-id="core-workflows-description"
      class="metaref-pref-description"
    />
    <checkbox
      data-l10n-id="workflow-compact-menu"
      preference="menu.compact"
      native="true"
    />
    <description
      data-l10n-id="workflow-compact-description"
      class="metaref-pref-description"
    />

    <html:section
      id="metaref-additional-menu-options"
      class="metaref-setting-card metaref-static-card"
    >
      <html:header
        class="metaref-card-heading"
        data-l10n-id="menu-additional-heading"
      />
      <description
        data-l10n-id="section-menu-description"
        class="metaref-pref-description"
      />
      <vbox id="__addonRef__-menu-settings" />
    </html:section>
    <!-- 字段右键菜单 -->
    <groupbox>
      <label><html:h3 data-l10n-id="section-menu-field" /></label>
      <checkbox
        data-l10n-id="menu-field-correct-title-punctuation"
        preference="menu.correct-title-punctuation"
        native="true"
      />
      <checkbox
        data-l10n-id="menu-field-correct-extra-order"
        preference="menu.correct-extra-order"
        native="true"
      />
    </groupbox>
  </groupbox>

  <groupbox id="metaref-data-settings">
    <label><html:h2 data-l10n-id="data-settings-heading" /></label>
    <description
      data-l10n-id="data-settings-description"
      class="metaref-pref-description"
    />
    <html:p id="metaref-runtime-data-policy" class="metaref-pref-description" />
    <groupbox id="metaref-feedback-performance">
      <label><html:h3 data-l10n-id="feedback-performance-heading" /></label>
      <checkbox
        data-l10n-id="notify-on-lint"
        preference="lint.notify"
        native="true"
      />

      <!-- lint.numConcurrent -->
      <hbox align="center">
        <label
          id="__addonRef__-concurrency-label"
          data-l10n-id="lint-numConcurrent"
        />
        <html:input
          type="number"
          min="1"
          max="16"
          step="1"
          preference="lint.numConcurrent"
          aria-labelledby="__addonRef__-concurrency-label"
        />
        <description
          data-l10n-id="lint-numConcurrent-description"
          class="metaref-pref-description"
        />
      </hbox>
    </groupbox>
    <groupbox>
      <label><html:h3 data-l10n-id="batch-feedback-heading" /></label>
      <button
        id="__addonRef__-integration-status"
        data-l10n-id="integration-status-button"
        native="true"
      />
      <description
        data-l10n-id="integration-undo-description"
        class="metaref-pref-description"
      />

      <description
        data-l10n-id="batch-feedback-description"
        class="metaref-pref-description"
      />
      <html:div
        id="metaref-last-batch-status"
        role="status"
        aria-live="polite"
      />
      <button
        id="metaref-last-batch-report"
        data-l10n-id="batch-feedback-view-report"
        native="true"
      />
    </groupbox>
    <groupbox>
      <label><html:h3 data-l10n-id="api-cache-heading" /></label>
      <description
        data-l10n-id="api-cache-description"
        class="metaref-pref-description"
      />
      <button
        id="metaref-clear-api-cache"
        data-l10n-id="api-cache-clear"
        native="true"
      />
      <html:div
        id="metaref-api-cache-status"
        role="status"
        aria-live="polite"
      />
    </groupbox>
  </groupbox>

  <groupbox id="metaref-tool-center">
    <label><html:h2 data-l10n-id="workflow-tool-center" /></label>
    <description
      data-l10n-id="workflow-tool-description"
      class="metaref-pref-description"
    />
    <html:select id="metaref-tool-choice" data-l10n-id="workflow-tool-choice" />
    <button
      id="metaref-run-tool"
      data-l10n-id="workflow-run-tool"
      native="true"
    />
    <html:div id="metaref-tool-status" role="status" aria-live="polite" />
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="section-rich-text" /></label>
    <checkbox
      data-l10n-id="enable-richtext-toolbar"
      preference="richtext.toolBar"
      native="true"
    />
    <checkbox
      data-l10n-id="enable-richtext-hotkey"
      preference="richtext.hotkey"
      native="true"
    />
    <description
      data-l10n-id="richtext-settings-description"
      class="metaref-pref-description"
    />
  </groupbox>

  <groupbox class="metaref-shortcuts-section">
    <label><html:h2 data-l10n-id="shortcuts-header" /></label>
    <description
      data-l10n-id="shortcut-description"
      class="metaref-pref-description"
    />
    <html:div class="metaref-shortcut-list">
      <html:div class="metaref-shortcut-row">
        <label
          class="metaref-shortcut-label"
          data-l10n-id="shortcut-subscript"
        />
        <html:input
          class="metaref-shortcut-input"
          type="text"
          size="20"
          preference="shortcut.subscript"
        />
        <description class="metaref-shortcut-preview" />
      </html:div>
      <html:div class="metaref-shortcut-row">
        <label
          class="metaref-shortcut-label"
          data-l10n-id="shortcut-supscript"
        />
        <html:input
          class="metaref-shortcut-input"
          type="text"
          size="20"
          preference="shortcut.supscript"
        />
        <description class="metaref-shortcut-preview" />
      </html:div>
      <html:div class="metaref-shortcut-row">
        <label class="metaref-shortcut-label" data-l10n-id="shortcut-bold" />
        <html:input
          class="metaref-shortcut-input"
          type="text"
          size="20"
          preference="shortcut.bold"
        />
        <description class="metaref-shortcut-preview" />
      </html:div>
      <html:div class="metaref-shortcut-row">
        <label class="metaref-shortcut-label" data-l10n-id="shortcut-italic" />
        <html:input
          class="metaref-shortcut-input"
          type="text"
          size="20"
          preference="shortcut.italic"
        />
        <description class="metaref-shortcut-preview" />
      </html:div>
      <html:div class="metaref-shortcut-row">
        <label class="metaref-shortcut-label" data-l10n-id="shortcut-nocase" />
        <html:input
          class="metaref-shortcut-input"
          type="text"
          size="20"
          preference="shortcut.nocase"
        />
        <description class="metaref-shortcut-preview" />
      </html:div>
      <html:div class="metaref-shortcut-row">
        <label class="metaref-shortcut-label" data-l10n-id="shortcut-lint" />
        <html:input
          class="metaref-shortcut-input"
          type="text"
          size="20"
          preference="shortcut.lint"
        />
        <description class="metaref-shortcut-preview" />
      </html:div>
      <html:div class="metaref-shortcut-row">
        <label
          class="metaref-shortcut-label"
          data-l10n-id="shortcut-chemicalFormula"
        />
        <html:input
          class="metaref-shortcut-input"
          type="text"
          size="20"
          preference="shortcut.chemicalFormula"
        />
        <description class="metaref-shortcut-preview" />
      </html:div>
      <html:div class="metaref-shortcut-row">
        <label
          class="metaref-shortcut-label"
          data-l10n-id="shortcut-easy-scholar"
        />
        <html:input
          class="metaref-shortcut-input"
          type="text"
          size="20"
          preference="shortcut.easyScholar"
        />
        <description class="metaref-shortcut-preview" />
      </html:div>
      <html:div class="metaref-shortcut-row"
        ><label
          class="metaref-shortcut-label"
          data-l10n-id="shortcut-titleSentence" /><html:input
          class="metaref-shortcut-input"
          type="text"
          size="20"
          preference="shortcut.titleSentence" /><description
          class="metaref-shortcut-preview"
      /></html:div>
      <html:div class="metaref-shortcut-row"
        ><label
          class="metaref-shortcut-label"
          data-l10n-id="shortcut-publicationCase" /><html:input
          class="metaref-shortcut-input"
          type="text"
          size="20"
          preference="shortcut.publicationCase" /><description
          class="metaref-shortcut-preview"
      /></html:div>
      <html:div class="metaref-shortcut-row"
        ><label
          class="metaref-shortcut-label"
          data-l10n-id="shortcut-dataDirectory" /><html:input
          class="metaref-shortcut-input"
          type="text"
          size="20"
          preference="shortcut.dataDirectory" /><description
          class="metaref-shortcut-preview"
      /></html:div>
      <html:div class="metaref-shortcut-row"
        ><label
          class="metaref-shortcut-label"
          data-l10n-id="shortcut-profileDirectory" /><html:input
          class="metaref-shortcut-input"
          type="text"
          size="20"
          preference="shortcut.profileDirectory" /><description
          class="metaref-shortcut-preview"
      /></html:div>
    </html:div>
    <description
      class="metaref-shortcut-status metaref-pref-description"
      aria-live="polite"
    />
  </groupbox>

  <!-- 详细设置 -->
  <groupbox>
    <label><html:h2 data-l10n-id="section-rules" /></label>

    <description
      data-l10n-id="section-item-description"
      class="metaref-pref-description"
    />
    <!-- 条目 -->
    <html:details class="metaref-pref-collapsible" open="open">
      <html:summary><html:h2 data-l10n-id="section-item" /></html:summary>
      <!-- 检测是否存在重复条目 -->
      <checkbox
        data-l10n-id="rule-no-item-duplication"
        preference="rule.no-item-duplication"
        native="true"
      />
      <!-- 检测网页条目 -->
      <checkbox
        data-l10n-id="rule-no-article-webpage"
        preference="rule.no-article-webpage"
        native="true"
      />
      <!-- 检测预印本误存为期刊文章 -->
      <checkbox
        data-l10n-id="rule-no-journal-preprint"
        preference="rule.no-journal-preprint"
        native="true"
      />
      <!-- 字段值不得为无效值 -->
      <checkbox
        data-l10n-id="rule-no-value-nullish"
        preference="rule.no-value-nullish"
        native="true"
      />
      <!-- 不应非法占用字段 -->
      <checkbox
        data-l10n-id="rule-no-field-misuse"
        preference="rule.no-field-misuse"
        native="true"
      />
    </html:details>

    <!-- General Field: Title -->
    <html:details class="metaref-pref-collapsible" open="open">
      <html:summary><html:h2 data-l10n-id="section-title" /></html:summary>

      <!-- correct-title-chemical-formula -->
      <checkbox
        data-l10n-id="rule-correct-title-chemical-formula"
        preference="rule.correct-title-chemical-formula"
        native="true"
      />
      <vbox class="indented-pref">
        <checkbox
          data-l10n-id="rule-correct-title-chemical-formula-option-normalize-spaces"
          preference="rule.correct-title-chemical-formula.normalize-spaces"
          native="true"
        />
        <description
          data-l10n-id="rule-correct-title-chemical-formula-description"
          class="metaref-pref-description"
        />
      </vbox>

      <!-- correct-title-sentence-case -->
      <checkbox
        id="__addonRef__-title-case"
        data-l10n-id="rule-correct-title-sentence-case"
        preference="rule.correct-title-sentence-case"
        native="true"
      />
      <vbox class="indented-pref">
        <hbox align="center">
          <label
            data-l10n-id="rule-correct-title-sentence-option-custom-term"
          />
          <html:input
            style="flex: 1"
            type="text"
            readonly="true"
            size="50"
            data-l10n-id="rule-correct-title-sentence-option-custom-term"
            preference="rule.correct-title-sentence-case.custom-term-path"
          />
          <button
            data-l10n-id="rule-correct-title-sentence-option-custom-term-button"
            id="__addonRef__-title-choose-custom-data-button"
            native="true"
          />
        </hbox>
        <description
          data-l10n-id="rule-correct-title-sentence-option-custom-term-desc"
          class="metaref-pref-description"
        />
        <hbox align="center">
          <label
            data-l10n-id="rule-correct-title-sentence-option-disabled-languages"
          />
          <html:input
            style="flex: 1"
            type="text"
            size="15"
            id="__addonRef__-title-case-disabled-languages"
            data-l10n-id="rule-correct-title-sentence-option-disabled-languages"
            preference="rule.correct-title-sentence-case.disabled-languages"
          />
          <label
            data-l10n-id="rule-correct-title-sentence-option-disabled-languages-doc"
            is="zotero-text-link"
            class="zotero-text-link"
            href="https://github.com/datasets/language-codes/blob/main/data/language-codes.csv"
          />
        </hbox>
        <description
          data-l10n-id="rule-correct-title-sentence-option-disabled-languages-desc"
          class="metaref-pref-description"
        />
      </vbox>

      <!-- no-title-trailing-dot -->
      <checkbox
        data-l10n-id="rule-no-title-trailing-dot"
        preference="rule.no-title-trailing-dot"
        native="true"
      />

      <!-- correct-title-punctuation -->
      <checkbox
        data-l10n-id="rule-correct-title-punctuation"
        preference="rule.correct-title-punctuation"
        native="true"
      />
      <vbox class="indented-pref">
        <checkbox
          data-l10n-id="rule-correct-title-punctuation-quotes"
          preference="rule.correct-title-punctuation.quotes"
          native="true"
        />
      </vbox>

      <!-- 需要短标题 -->
      <checkbox
        data-l10n-id="rule-require-short-title"
        preference="rule.require-short-title"
        native="true"
      />

      <!-- correct-shortTitle-sentence-case -->
      <checkbox
        data-l10n-id="rule-correct-shortTitle-sentence-case"
        preference="rule.correct-shortTitle-sentence-case"
        native="true"
      />
      <description
        data-l10n-id="rule-correct-shortTitle-sentence-case-description"
        class="indented-pref metaref-pref-description"
      />
    </html:details>

    <!-- General Field: Creators -->
    <html:details class="metaref-pref-collapsible">
      <html:summary><html:h2 data-l10n-id="section-creators" /></html:summary>
      <!-- require-creators -->
      <checkbox
        data-l10n-id="rule-require-creators"
        preference="rule.require-creators"
        native="true"
      />
      <!-- 修改作者大小写 -->
      <checkbox
        data-l10n-id="rule-correct-creators-case"
        preference="rule.correct-creators-case"
        native="true"
      />
      <!-- 修改作者中文拼音是否拆分 -->
      <checkbox
        data-l10n-id="rule-correct-creators-pinyin"
        preference="rule.correct-creators-pinyin"
        native="true"
      />
      <!-- correct-creators-punctuation -->
      <checkbox
        data-l10n-id="rule-correct-creators-punctuation"
        preference="rule.correct-creators-punctuation"
        native="true"
      />
    </html:details>

    <!-- General Field: Language -->
    <html:details class="metaref-pref-collapsible">
      <html:summary><html:h2 data-l10n-id="section-language" /></html:summary>
      <checkbox
        data-l10n-id="rule-require-language"
        preference="rule.require-language"
        native="true"
      />
      <vbox class="indented-pref">
        <checkbox
          id="__addonRef__-lang-only"
          data-l10n-id="rule-require-language-option-only"
          preference="rule.require-language.only"
          native="true"
        />
        <vbox class="indented-pref">
          <hbox align="center">
            <checkbox
              id="__addonRef__-lang-only-cmn"
              data-l10n-id="rule-require-language-option-only-cmn"
              preference="rule.require-language.only.cmn"
              native="true"
            />
            <checkbox
              id="__addonRef__-lang-only-eng"
              data-l10n-id="rule-require-language-option-only-eng"
              preference="rule.require-language.only.eng"
              native="true"
            />
            <label data-l10n-id="rule-require-language-option-only-other" />
            <html:input
              type="text"
              id="__addonRef__-lang-only-other"
              preference="rule.require-language.only.other"
            />
            <label
              data-l10n-id="rule-require-language-option-only-other-doc"
              is="zotero-text-link"
              class="zotero-text-link"
              href="https://github.com/groele/Zotero-MetaFlow/blob/main/docs/features.md#require-language-require-language"
            />
          </hbox>
          <description
            data-l10n-id="rule-require-language-option-only-other-desc"
            class="metaref-pref-description"
          />
        </vbox>
        <checkbox
          data-l10n-id="rule-require-language-option-verify-before"
          preference="rule.require-language.verify-before"
          native="true"
        />
      </vbox>
    </html:details>

    <!-- Article Related Field -->
    <html:details class="metaref-pref-collapsible" open="open">
      <html:summary><html:h2 data-l10n-id="section-article" /></html:summary>
      <!-- 修正期刊名别称 -->
      <checkbox
        data-l10n-id="rule-correct-publication-title-alias"
        preference="rule.correct-publication-title-alias"
        native="true"
      />
      <!-- 修正期刊名大小写 -->
      <checkbox
        data-l10n-id="rule-correct-publication-title-case"
        preference="rule.correct-publication-title-case"
        native="true"
      />

      <!-- 字段：缩写 -->
      <groupbox id="metaref-journal-abbreviation-settings">
        <label><html:h2 data-l10n-id="section-article-abbreviation" /></label>
        <!-- 更新期刊缩写 -->
        <checkbox
          data-l10n-id="rule-require-journal-abbr"
          preference="rule.require-journal-abbr"
          native="true"
        />
        <vbox class="indented-pref">
          <description
            data-l10n-id="abbr-settings-description"
            class="metaref-pref-description"
          />
          <hbox align="center"
            ><label
              id="metaref-abbr-sourceMode-label"
              data-l10n-id="abbr-setting-sourcemode" /><html:select
              data-abbr-option="sourceMode"
              aria-labelledby="metaref-abbr-sourceMode-label"
            >
              <html:option value="auto" data-l10n-id="abbr-choice-auto" />
              <html:option value="custom" data-l10n-id="abbr-choice-custom" />
              <html:option value="builtin" data-l10n-id="abbr-choice-builtin" />
              <html:option
                value="iso4"
                data-l10n-id="abbr-choice-iso4"
              /> </html:select
          ></hbox>
          <hbox align="center"
            ><label
              id="metaref-abbr-profile-label"
              data-l10n-id="abbr-setting-profile" /><html:select
              data-abbr-option="profile"
              aria-labelledby="metaref-abbr-profile-label"
            >
              <html:option
                value="combined"
                data-l10n-id="abbr-choice-combined"
              />
              <html:option value="ieee" data-l10n-id="abbr-choice-ieee" />
              <html:option value="acs" data-l10n-id="abbr-choice-acs" />
              <html:option value="ams" data-l10n-id="abbr-choice-ams" />
              <html:option value="aea" data-l10n-id="abbr-choice-aea" />
              <html:option
                value="annee-philologique"
                data-l10n-id="abbr-choice-annee-philologique"
              />
              <html:option
                value="astronomy"
                data-l10n-id="abbr-choice-astronomy"
              />
              <html:option value="dainst" data-l10n-id="abbr-choice-dainst" />
              <html:option value="entrez" data-l10n-id="abbr-choice-entrez" />
              <html:option
                value="geology_physics_variations"
                data-l10n-id="abbr-choice-geology_physics_variations"
              />
              <html:option
                value="lifescience"
                data-l10n-id="abbr-choice-lifescience"
              />
              <html:option
                value="mathematics"
                data-l10n-id="abbr-choice-mathematics"
              />
              <html:option
                value="mechanical"
                data-l10n-id="abbr-choice-mechanical"
              />
              <html:option
                value="meteorology"
                data-l10n-id="abbr-choice-meteorology"
              />
              <html:option
                value="sociology"

        data-l10n-id="rule-correct-filing-date-format"
        preference="rule.correct-filing-date-format"
        native="true"
      />
      <checkbox
        data-l10n-id="rule-correct-issue-date-format"
        preference="rule.correct-issue-date-format"
        native="true"
      />
      <checkbox
        data-l10n-id="rule-correct-priority-date-format"
        preference="rule.correct-priority-date-format"
        native="true"
      />
    </html:details>

    <!-- 标识符 -->
    <html:details class="metaref-pref-collapsible">
      <html:summary><html:h2 data-l10n-id="section-identifier" /></html:summary>
      <!-- DOI: 需要 DOI -->
      <checkbox
        data-l10n-id="rule-require-doi"
        preference="rule.require-doi"
        native="true"
      />
      <!-- DOI: 无前缀 -->
      <checkbox
        data-l10n-id="rule-no-doi-prefix"
        preference="rule.no-doi-prefix"
        native="true"
      />
    </html:details>

    <!-- General Field: Others -->
    <html:details class="metaref-pref-collapsible">
      <html:summary><html:h2 data-l10n-id="section-others" /></html:summary>
      <!-- 更新日期格式 -->
      <checkbox
        data-l10n-id="rule-correct-date-format"
        preference="rule.correct-date-format"
        native="true"
      />
      <checkbox
        data-l10n-id="rule-correct-abstract-format"
        preference="rule.correct-abstract-format"
        native="true"
      />
      <description data-l10n-id="rule-correct-abstract-format-description" />
      <!-- Extra -->
      <checkbox
        data-l10n-id="rule-correct-extra-order"
        preference="rule.correct-extra-order"
        native="true"
      />
    </html:details>
  </groupbox>

  <!-- 更新元数据 -->
  <groupbox>
    <label><html:h2 data-l10n-id="section-updateMetadata" /></label>
    <!-- Persistent update policy -->
    <groupbox>
      <label><html:h3 data-l10n-id="metadata-update-defaults" /></label>
      <hbox align="center">
        <label data-l10n-id="metadata-source-priority"></label>
        <radiogroup
          orient="horizontal"
          id="metaref-metadata-source-priority"
          preference="rule.tool-update-metadata.option.mode"
        >
          <radio data-l10n-id="metadata-source-local" value="blank" />
          <radio data-l10n-id="metadata-source-cloud" value="all" />
        </radiogroup>
      </hbox>

      <description
        data-l10n-id="metadata-update-saved-description"
        class="metaref-pref-description"
      />
      <checkbox
        data-l10n-id="metadata-repair-creators"
        preference="metadata.repairCreators"
        native="true"
      />
      <description
        data-l10n-id="metadata-repair-creators-description"
        class="metaref-pref-description"
      />
      <checkbox
        data-l10n-id="metadata-update-journal-info"
        preference="metadata.updateJournalInfo"
        native="true"
      />
      <description
        data-l10n-id="metadata-update-journal-info-description"
        class="metaref-pref-description"
      />
      <checkbox
        data-l10n-id="metadata-update-snapshots"
        preference="workflow.reviveSnapshots"
        native="true"
      />
      <description
        data-l10n-id="metadata-update-snapshots-description"
        class="metaref-pref-description"
      />
      <checkbox
        data-l10n-id="metadata-update-tldr"
        preference="workflow.tldrEnabled"
        native="true"
      />
      <description
        data-l10n-id="metadata-update-tldr-description"
        class="metaref-pref-description"
      />
      <vbox class="indented-pref">
        <hbox align="center">
          <label data-l10n-id="metadata-tldr-target-label" />
          <radiogroup
            orient="horizontal"
            id="metaref-tldr-target"
            preference="workflow.tldrTarget"
          >
            <radio data-l10n-id="metadata-tldr-target-note" value="note" />
            <radio data-l10n-id="metadata-tldr-target-extra" value="extra" />
            <radio data-l10n-id="metadata-tldr-target-both" value="both" />
          </radiogroup>
        </hbox>
        <hbox align="center" style="margin-top: 6px">
          <label data-l10n-id="metadata-tldr-extra-format-label" />
          <radiogroup
            orient="horizontal"
            id="metaref-tldr-extra-format"
            preference="workflow.tldrExtraFormat"
          >
            <radio
              data-l10n-id="metadata-tldr-extra-format-remark"
              value="remark"
            />
            <radio
              data-l10n-id="metadata-tldr-extra-format-tldr"
              value="tldr"
            />
          </radiogroup>
        </hbox>
      </vbox>
      <description
        data-l10n-id="rule-tool-update-metadata-dialog-note-rate-limit"
        class="metaref-pref-description"
      />
      <description
        data-l10n-id="rule-tool-update-metadata-dialog-note-chinese-limit"
        class="metaref-pref-description"
      />
      <description
        data-l10n-id="rule-tool-update-metadata-dialog-note-type-change"
        class="metaref-pref-description"
      />
    </groupbox>

    <groupbox>
      <label><html:h3 data-l10n-id="workflow-legacy-heading" /></label>
      <description
        data-l10n-id="workflow-legacy-description"
        class="metaref-pref-description"
      />
      <!-- DOI: 应为长型 -->
      <checkbox
        data-l10n-id="rule-correct-doi-long"
        preference="rule.correct-doi-long"
        native="true"
      />
    </groupbox>

    <!-- Semantic Scholar Token -->
    <groupbox>
      <label><html:h3 data-l10n-id="metadata-provider-options" /></label>
      <hbox align="center">
        <label
          data-l10n-id="rule-tool-update-metadata-option-semanticScholarToken"
        />
        <html:input
          style="flex: 1"
          type="password"
          size="30"
          autocomplete="new-password"
          spellcheck="false"
          data-l10n-id="rule-tool-update-metadata-option-semanticScholarToken"
          preference="semanticScholarToken"
        />
        <label
          data-l10n-id="rule-tool-update-metadata-option-semanticScholarToken-link"
          is="zotero-text-link"
          class="zotero-text-link"
          href="https://www.semanticscholar.org/product/api#api-key"
        />
      </hbox>
      <description
        data-l10n-id="rule-tool-update-metadata-option-semanticScholarToken-desc"
        class="metaref-pref-description"
      />
    </groupbox>
  </groupbox>

  <groupbox id="metaref-duplicate-settings">
    <label><html:h2 data-l10n-id="duplicates-heading" /></label>
    <description
      data-l10n-id="duplicates-description"
      class="metaref-pref-description"
    />
    <groupbox>
      <label><html:h3 data-l10n-id="duplicates-default-heading" /></label>
      <html:div
        id="metaref-duplicates-default-action"
        role="radiogroup"
        data-l10n-id="duplicates-default-aria"
      />
    </groupbox>
    <groupbox>
      <label><html:h3 data-l10n-id="duplicates-master-heading" /></label>
      <html:div
        id="metaref-duplicates-master"
        role="radiogroup"
        data-l10n-id="duplicates-master-aria"
      />
      <label
        control="metaref-duplicates-concurrency"
        data-l10n-id="duplicates-concurrency"
      />
      <html:input
        id="metaref-duplicates-concurrency"
        type="number"
        min="1"
        max="8"
        step="1"
        data-l10n-id="duplicates-concurrency-aria"
      />
    </groupbox>
    <groupbox>
      <label><html:h3 data-l10n-id="duplicates-type-heading" /></label>
      <checkbox
        data-l10n-id="duplicates-different-types"
        preference="duplicates.mergeDifferentTypes"
        native="true"
      />
      <description
        data-l10n-id="duplicates-type-description"
        class="metaref-pref-description"
      />
    </groupbox>
    <groupbox>
      <label><html:h3 data-l10n-id="duplicates-view-heading" /></label>
      <checkbox
        data-l10n-id="duplicates-show-stats"
        preference="duplicates.showStats"
        native="true"
      />
      <button
        id="metaref-duplicates-refresh"
        data-l10n-id="duplicates-refresh"
        native="true"
      />
    </groupbox>
    <groupbox>
      <label><html:h3 data-l10n-id="duplicates-actions-heading" /></label>
      <button
        id="metaref-duplicates-review"
        data-l10n-id="duplicates-review"
        native="true"
      />
      <button
        id="metaref-duplicates-bulk"
        data-l10n-id="duplicates-bulk"
        native="true"
      />
      <button
        id="metaref-duplicates-pause"
        data-l10n-id="duplicates-pause"
        native="true"
      />
      <button
        id="metaref-duplicates-cancel"
        data-l10n-id="duplicates-cancel"
        native="true"
      />
    </groupbox>
    <groupbox>
      <label><html:h3 data-l10n-id="duplicates-data-heading" /></label>
      <description
        data-l10n-id="duplicates-data-description"
        class="metaref-pref-description"
      />
      <button
        id="metaref-duplicates-export"
        data-l10n-id="duplicates-export"
        native="true"
      />
      <button
        id="metaref-duplicates-import"
        data-l10n-id="duplicates-import"
        native="true"
      />
    </groupbox>
    <html:div id="metaref-duplicates-status" role="status" aria-live="polite" />
  </groupbox>

  <!-- 关于 -->
  <groupbox>
    <label><html:h2 data-l10n-id="section-about" /></label>
    <label
      data-l10n-id="help-version"
      data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
    />
    <hbox align="center">
      <label data-l10n-id="about-repo-label" />
      <label
        is="zotero-text-link"
        class="zotero-text-link"
        href="__homepage__"
        value="__homepage__"
      />
    </hbox>
  </groupbox>
</vbox>
